<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Задачи команды{% endblock %}</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:24px;background:#f8fafc;color:#1f2937}main{max-width:1280px;margin:auto}nav,.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}a{color:#1d4ed8}section,.card{padding:20px;background:white;border:1px solid #d1d5db;border-radius:12px;margin:18px 0}label{display:grid;gap:6px}input,select,button{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px}button{background:#111827;color:white;cursor:pointer}button.secondary{background:white;color:#111827}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.muted{color:#64748b}.error{background:#fef2f2;color:#991b1b;padding:12px}.notice{background:#eff6ff;padding:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e5e7eb;vertical-align:top}td{white-space:pre-wrap;overflow-wrap:anywhere}fieldset{border:1px solid #e2e8f0;border-radius:8px;max-height:230px;overflow:auto;margin:16px 0}fieldset label{display:flex;align-items:center;padding:6px}h1{margin-bottom:6px}h2{font-size:21px}dt{font-weight:600;margin-top:16px}dd{margin:6px 0;white-space:pre-wrap}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #60a5fa}@media(max-width:600px){body{margin:12px}section{padding:14px}}
.filter-actions{margin-top:20px}dialog{color:inherit;border:1px solid #cbd5e1;border-radius:16px;padding:24px;width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 48px);overflow:auto;box-shadow:0 24px 80px #0f172a40}dialog::backdrop{background:#0f172a70}dialog h2{margin-top:0}dialog input{width:100%}.saved-filter-list{margin-bottom:20px}.saved-filter-row{display:grid;gap:12px;padding:16px 0;border-bottom:1px solid #e2e8f0}.saved-filter-row strong{overflow-wrap:anywhere}
</style></head><body><main><nav><a href="/employee">Мои задачи</a><a href="/manager">Задачи команды</a>{% block nav %}{% endblock %}</nav>{% block content %}{% endblock %}</main></body></html>
